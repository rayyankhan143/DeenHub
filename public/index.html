<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeenHub</title>
  <style>
    :root { --bg: #f7f5ef; --fg: #1d2a24; --accent: #1f6f50; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111814; --fg: #e8eee9; --accent: #5cc796; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); text-align: center; }
    h1 { font-size: clamp(2.5rem, 8vw, 4rem); margin: 0 0 .5rem; color: var(--accent); }
    p { font-size: 1.15rem; max-width: 36rem; line-height: 1.6; margin: 0 auto; }
  </style>
</head>
<body>
  <main>
    <h1>DeenHub</h1>
    <p>Assalamu alaikum! The site is live and under construction. Check back soon.</p>
  </main>
</body>
</html>
